<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Russian Drills</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --btn: #334155;
      --btn-hover: #475569;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #mute-btn[aria-pressed="true"] {
      background: #0f3d2e;
      border-color: #1f6f52;
    }
    select, button {
      background: var(--btn);
      color: var(--text);
      border: 1px solid #475569;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
      touch-action: manipulation;
    }
    select:hover, button:hover { background: var(--btn-hover); }
    button:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; }
    button.correct { background: var(--correct) !important; color: #052e16; font-weight: 600; }
    button.wrong { background: var(--wrong) !important; color: #450a0a; font-weight: 600; }

    .prompt {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      padding: 20px;
      background: rgba(56,189,248,0.1);
      border-radius: 12px;
      margin: 16px 0;
      min-height: 64px;
      display: grid;
      place-items: center;
    }
    .prompt-wrap {
      display: grid;
      gap: 8px;
      margin: 16px 0;
    }
    .prompt-wrap .prompt {
      margin: 0;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .audio-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
    }
    .play-btn {
      min-width: 26px;
      min-height: 26px;
      padding: 0;
      font-size: 0.7rem;
      font-weight: 500;
      border-radius: 999px;
      opacity: 0.74;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover { opacity: 1; }
    .play-btn .icon {
      line-height: 1;
      display: inline-block;
    }
    .speed-btn[aria-pressed="true"] {
      background: #312e81;
      border-color: #6366f1;
      opacity: 1;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .option-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      text-align: center;
    }

    .tally {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
      text-align: center;
      font-size: 0.95rem;
    }
    .tally div {
      background: rgba(148,163,184,0.15);
      padding: 10px 6px;
      border-radius: 8px;
    }
    .tally .label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .tally .value {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .last-result {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
      min-height: 24px;
    }

    .build-stamp {
      margin-top: 14px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      opacity: 0.9;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.78);
      z-index: 20;
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal {
      width: min(100%, 360px);
      background: #162033;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.42);
    }
    .modal h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }
    .modal p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .modal-actions .danger-btn {
      background: #7f1d1d;
      border-color: #b91c1c;
    }
    .modal-actions .danger-btn:hover {
      background: #991b1b;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
        place-items: stretch;
      }
      .app {
        border-radius: 14px;
        padding: 16px;
      }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      h1 {
        text-align: center;
        font-size: 1.35rem;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .controls select {
        grid-column: 1 / -1;
        text-align: center;
        text-align-last: center;
      }
      .controls select,
      .controls button {
        width: 100%;
        min-height: 44px;
      }
      .prompt {
        min-height: 56px;
        padding: 16px;
        font-size: 1.2rem;
      }
      .options { grid-template-columns: 1fr; }
      .option-btn {
        min-height: 52px;
        font-size: 1rem;
      }
      .tally { grid-template-columns: 1fr; }
      .play-btn {
        min-width: 30px;
        min-height: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Russian Drills</h1>
      <div class="controls">
        <select id="quiz-type" aria-label="Quiz type">
          <option value="pronouns">Verb conjugations</option>
          <option value="numbers">Numbers 0–20</option>
          <option value="vocabulary">Vocabulary</option>
        </select>
        <button id="next-btn" type="button">New Question</button>
        <button id="reset-btn" type="button">Reset Tally</button>
      </div>
    </header>

    <div class="prompt-wrap">
      <div id="prompt" class="prompt" role="status" aria-live="polite">Loading…</div>
    </div>
    <div id="options" class="options" role="group" aria-label="Answer choices"></div>
    <div class="last-result">
      <div class="audio-controls" aria-label="Audio controls">
        <button id="mute-btn" class="play-btn" type="button" aria-pressed="false" aria-label="Toggle audio mute" title="Toggle audio mute"><span class="icon">🔇</span></button>
        <button id="play-audio-btn" class="play-btn" type="button" aria-label="Play pronunciation" title="Play pronunciation"><span class="icon">▶</span></button>
        <button id="replay-audio-btn" class="play-btn" type="button" aria-label="Replay pronunciation" title="Replay pronunciation"><span class="icon">↺</span></button>
        <button id="speed-btn" class="play-btn speed-btn" type="button" aria-pressed="false" aria-label="Toggle slower audio" title="Toggle slower audio"><span class="icon">0.8×</span></button>
      </div>
      <div id="last-result" class="sr-only" aria-live="polite">—</div>
    </div>

    <div class="tally" aria-label="Progress tally">
      <div><span class="label">Correct</span><span class="value" id="correct">0</span></div>
      <div><span class="label">Incorrect</span><span class="value" id="incorrect">0</span></div>
      <div><span class="label">Attempts</span><span class="value" id="attempts">0</span></div>
    </div>

    <div id="build-stamp" class="build-stamp" aria-live="polite">Last updated: loading...</div>
  </div>

  <div id="reset-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title" aria-describedby="reset-modal-text">
      <h2 id="reset-modal-title">Reset tally?</h2>
      <p id="reset-modal-text">This clears the stored correct, incorrect, and attempts counts.</p>
      <div class="modal-actions">
        <button id="reset-cancel-btn" type="button">Cancel</button>
        <button id="reset-confirm-btn" class="danger-btn" type="button">Reset</button>
      </div>
    </div>
  </div>

  <script>
    // Russian verbs and pronouns data model
    const verbs = {
      "думать":{ infinitive: "думать", conjugations: { ya: "думаю", ty: "думаешь", on: "думает", my: "думаем", vy: "думаете", oni: "думают" }},
      "отдыхать":{ infinitive: "отдыхать", conjugations: { ya: "отдыхаю", ty: "отдыхаешь", on: "отдыхает", my: "отдыхаем", vy: "отдыхаете", oni: "отдыхают" }},
      "гулять":{ infinitive: "гулять", conjugations: { ya: "гуляю", ty: "гуляешь", on: "гуляет", my: "гуляем", vy: "гуляете", oni: "гуляют" }},
      "уметь":{ infinitive: "уметь", conjugations: { ya: "умею", ty: "умеешь", on: "умеет", my: "умеем", vy: "умеете", oni: "умеют" }},
      "читать":{ infinitive: "читать", conjugations: { ya: "читаю", ty: "читаешь", on: "читает", my: "читаем", vy: "читаете", oni: "читают" }},
      "работать":{ infinitive: "работать", conjugations: { ya: "работаю", ty: "работаешь", on: "работает", my: "работаем", vy: "работаете", oni: "работают" }},
      "говорить":{ infinitive: "говорить", conjugations: { ya: "говорю", ty: "говоришь", on: "говорит", my: "говорим", vy: "говорите", oni: "говорят" }},
      "ужинать":{ infinitive: "ужинать", conjugations: { ya: "ужинаю", ty: "ужинаешь", on: "ужинает", my: "ужинаем", vy: "ужинаете", oni: "ужинают" }},
      "мечтать":{ infinitive: "мечтать", conjugations: { ya: "мечтаю", ty: "мечтаешь", on: "мечтает", my: "мечтаем", vy: "мечтаете", oni: "мечтают" }},
      "знать":{ infinitive: "знать", conjugations: { ya: "знаю", ty: "знаешь", on: "знает", my: "знаем", vy: "знаете", oni: "знают" }},
      "жить":{ infinitive: "жить", conjugations: { ya: "живу", ty: "живёшь", on: "живёт", my: "живём", vy: "живёте", oni: "живут" }},
      "понимать":{ infinitive: "понимать", conjugations: { ya: "понимаю", ty: "понимаешь", on: "понимает", my: "понимаем", vy: "понимаете", oni: "понимают" }},
      "писать":{ infinitive: "писать", conjugations: { ya: "пишу", ty: "пишешь", on: "пишет", my: "пишем", vy: "пишете", oni: "пишут" }},
      "играть":{ infinitive: "играть", conjugations: { ya: "играю", ty: "играешь", on: "играет", my: "играем", vy: "играете", oni: "играют" }},
      "учиться":{ infinitive: "учиться", conjugations: { ya: "учусь", ty: "учишься", on: "учится", my: "учимся", vy: "учитесь", oni: "учатся" }},
      "мочь":{ infinitive: "мочь", conjugations: { ya: "могу", ty: "можешь", on: "может", my: "можем", vy: "можете", oni: "могут" }},
      "делать":{ infinitive: "делать", conjugations: { ya: "делаю", ty: "делаешь", on: "делает", my: "делаем", vy: "делаете", oni: "делают" }},
      "обедать":{ infinitive: "обедать", conjugations: { ya: "обедаю", ty: "обедаешь", on: "обедает", my: "обедаем", vy: "обедаете", oni: "обедают" }},
      "танцевать":{ infinitive: "танцевать", conjugations: { ya: "танцую", ty: "танцуешь", on: "танцует", my: "танцуем", vy: "танцуете", oni: "танцуют" }},
      "завтракать":{ infinitive: "завтракать", conjugations: { ya: "завтракаю", ty: "завтракаешь", on: "завтракает", my: "завтракаем", vy: "завтракаете", oni: "завтракают" }},
      "спать":{ infinitive: "спать", conjugations: { ya: "сплю", ty: "спишь", on: "спит", my: "спим", vy: "спите", oni: "спят" }}
    };

    const pronouns = {
      ya: { translit: "Ya", cyr: "Я" }, ty: { translit: "Ty", cyr: "Ты" }, on: { translit: "On", cyr: "Он" },
      ona: { translit: "Ona", cyr: "Она" }, ono: { translit: "Ono", cyr: "Оно" }, my: { translit: "My", cyr: "Мы" },
      vy: { translit: "Vy", cyr: "Вы" }, oni:{ translit: "Oni", cyr: "Они" }
    };

    const numbers = {
      0: 'ноль', 1: 'один', 2: 'два', 3: 'три', 4: 'четыре', 5: 'пять', 6: 'шесть', 7: 'семь',
      8: 'восемь', 9: 'девять', 10: 'десять', 11: 'одиннадцать', 12: 'двенадцать', 13: 'тринадцать',
      14: 'четырнадцать', 15: 'пятнадцать', 16: 'шестнадцать', 17: 'семнадцать', 18: 'восемнадцать',
      19: 'девятнадцать', 20: 'двадцать'
    };

    // Vocabulary list updated to use ONLY base/infinitive forms. 
    // Pronoun-prefixed phrases replaced with their dictionary forms to guarantee no conjugations appear.
    const vocabulary = [
      { ru: 'Думать', en: 'To think' },
      { ru: 'Понимать', en: 'To understand' },
      { ru: 'Танцевать', en: 'To dance' },
      { ru: 'Работать', en: 'To work' },
      { ru: 'Гулять', en: 'To go for a walk' },
      { ru: 'Завтракать', en: 'To have breakfast' },
      { ru: 'Спать', en: 'To sleep' },
      { ru: 'Обедать', en: 'To have lunch' },
      { ru: 'Читать', en: 'To read' },
      { ru: 'Говорить', en: 'To speak' },
      { ru: 'Ужинать', en: 'To have dinner' },
      { ru: 'Мечтать', en: 'To dream about' },
      { ru: 'Мочь', en: 'To be able to / can' },
      { ru: 'Учиться', en: 'To study' },
      { ru: 'Уметь', en: 'To know how to do something' },
      { ru: 'Делать', en: 'To do' },
      { ru: 'Писать', en: 'To write' },
      { ru: 'Знать', en: 'To know' },
      { ru: 'Отдыхать', en: 'To relax, to rest' },
      { ru: 'Играть', en: 'To play' },
      { ru: 'Жить', en: 'To live' },

      // Common nouns
      { ru: 'Дом', en: 'House' },
      { ru: 'Книга', en: 'Book' },
      { ru: 'Стол', en: 'Table' },
      { ru: 'Машина', en: 'Car' },
      { ru: 'Друг', en: 'Friend' },
      { ru: 'Школа', en: 'School' },
      { ru: 'Город', en: 'City' },
      { ru: 'Вода', en: 'Water' },
      { ru: 'Хлеб', en: 'Bread' },
      { ru: 'Яблоко', en: 'Apple' },

      // Directions / position
      { ru: 'Налево', en: 'Left' },
      { ru: 'Направо', en: 'Right' },
      { ru: 'Вперёд', en: 'Forward' },
      { ru: 'Назад', en: 'Back' },
      { ru: 'Здесь', en: 'Here' },
      { ru: 'Там', en: 'There' },

      // Times of day
      { ru: 'Утро', en: 'Morning' },
      { ru: 'День', en: 'Day / Afternoon' },
      { ru: 'Вечер', en: 'Evening' },
      { ru: 'Ночь', en: 'Night' },

      // Question words
      { ru: 'Кто', en: 'Who' },
      { ru: 'Что', en: 'What' },
      { ru: 'Где', en: 'Where' },
      { ru: 'Когда', en: 'When' },
      { ru: 'Почему', en: 'Why' },
      { ru: 'Как', en: 'How' },

      // Common adjectives
      { ru: 'Большой', en: 'Big' },
      { ru: 'Маленький', en: 'Small' },
      { ru: 'Хороший', en: 'Good' },
      { ru: 'Плохой', en: 'Bad' },
      { ru: 'Новый', en: 'New' },
      { ru: 'Старый', en: 'Old' }
    ];

    const verbGloss = {
      думать: 'To think', отдыхать: 'To relax, to rest', гулять: 'To go for a walk', уметь: 'To know how to do something',
      читать: 'To read', работать: 'To work', говорить: 'To speak', ужинать: 'To have dinner', мечтать: 'To dream about',
      знать: 'To know', жить: 'To live', понимать: 'To understand', писать: 'To write', играть: 'To play',
      учиться: 'To study', мочь: 'To be able to / can', делать: 'To do', обедать: 'To have lunch', танцевать: 'To dance',
      завтракать: 'To have breakfast', спать: 'To sleep'
    };

    const STORAGE_KEY = 'russian-conj-tally-v1';
    const QUESTION_STATS_KEY = 'russian-conj-question-stats-v1';
    const AUDIO_MUTE_KEY = 'russian-drills-audio-muted-v1';
    const AUDIO_SLOW_KEY = 'russian-drills-audio-slow-v1';
    const AUDIO_MANIFEST_URL = 'audio/manifest.json';
    const APP_LAST_UPDATED = '2026-05-29 0710hrs BST';
    let tally = { correct:0, incorrect:0, attempts:0 };
    let questionStats = {};
    let lastQuestionKey = null;
    let audioByText = {};
    let audioMuted = true;
    let audioSlow = true;
    let currentAudio = null;
    let currentPromptAudioText = '';

    const quizType = document.getElementById('quiz-type');
    const muteBtn = document.getElementById('mute-btn');
    const nextBtn = document.getElementById('next-btn');
    const resetBtn = document.getElementById('reset-btn');
    const playAudioBtn = document.getElementById('play-audio-btn');
    const replayAudioBtn = document.getElementById('replay-audio-btn');
    const speedBtn = document.getElementById('speed-btn');
    const promptEl = document.getElementById('prompt');
    const optionsEl = document.getElementById('options');
    const correctEl = document.getElementById('correct');
    const incorrectEl = document.getElementById('incorrect');
    const attemptsEl = document.getElementById('attempts');
    const lastResultEl = document.getElementById('last-result');
    const buildStampEl = document.getElementById('build-stamp');
    const resetModalEl = document.getElementById('reset-modal');
    const resetCancelBtn = document.getElementById('reset-cancel-btn');
    const resetConfirmBtn = document.getElementById('reset-confirm-btn');
    let resetModalReturnFocus = null;

    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){
          const parsed = JSON.parse(raw);
          tally = Object.assign(tally, parsed);
        }
      }catch(e){ console.warn('Failed to load state', e); }

      try{
        const rawQuestionStats = localStorage.getItem(QUESTION_STATS_KEY);
        if(rawQuestionStats){
          const parsedQuestionStats = JSON.parse(rawQuestionStats);
          if(parsedQuestionStats && typeof parsedQuestionStats === 'object') questionStats = parsedQuestionStats;
        }
      }catch(e){ console.warn('Failed to load question stats', e); }
    }
    function saveState(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tally)); }catch(e){ console.warn('Failed to save state', e); }
      try{ localStorage.setItem(QUESTION_STATS_KEY, JSON.stringify(questionStats)); }catch(e){ console.warn('Failed to save question stats', e); }
    }
    function resetState(){ tally = { correct:0, incorrect:0, attempts:0 }; questionStats = {}; lastQuestionKey = null; saveState(); renderTally(); }
    function renderTally(){ correctEl.textContent = tally.correct; incorrectEl.textContent = tally.incorrect; attemptsEl.textContent = tally.attempts; }

    function openResetModal(){
      resetModalReturnFocus = document.activeElement;
      resetModalEl.hidden = false;
      resetConfirmBtn.focus();
    }

    function closeResetModal(){
      resetModalEl.hidden = true;
      if(resetModalReturnFocus && typeof resetModalReturnFocus.focus === 'function'){
        resetModalReturnFocus.focus();
      }
    }

    function confirmReset(){
      resetState();
      lastResultEl.textContent = '—';
      closeResetModal();
    }

    function getQuestionStat(key){
      const stat = questionStats[key];
      if(!stat) return { correct:0, incorrect:0 };
      return { correct: Number(stat.correct) || 0, incorrect: Number(stat.incorrect) || 0 };
    }

    function updateQuestionStat(key, isCorrect){
      const stat = getQuestionStat(key);
      if(isCorrect) stat.correct += 1;
      else stat.incorrect += 1;
      questionStats[key] = stat;
    }

    function getQuestionWeight(questionKey){
      const stat = getQuestionStat(questionKey);
      const weight = 1 + (stat.incorrect * 3) - (stat.correct * 0.5);
      return Math.max(0.25, weight);
    }

    function pickWeightedQuestion(items, excludedKey){
      if(!Array.isArray(items) || items.length === 0) return null;
      const pool = items.filter(item => item.key !== excludedKey);
      const candidates = pool.length > 0 ? pool : items;
      let totalWeight = 0;
      for(const item of candidates){ totalWeight += getQuestionWeight(item.key); }
      if(totalWeight <= 0) return candidates[Math.floor(Math.random() * candidates.length)];

      let target = Math.random() * totalWeight;
      for(const item of candidates){
        target -= getQuestionWeight(item.key);
        if(target <= 0) return item;
      }
      return candidates[candidates.length - 1];
    }

    function getSelectedVerbs(){ return Object.keys(verbs); }
    function buildPrompt(pronounKey, verbKey){
      const pron = pronouns[pronounKey].cyr;
      return `${pron} — ${verbKey}`;
    }
    function pronounToConjKey(pronKey){ if(pronKey === 'ona' || pronKey === 'ono') return 'on'; return pronKey; }

    function makeOptions(correctForm, verbKey, optionCount = 4){
      const opts = new Set(); opts.add(correctForm);
      const sameVerbForms = Object.values(verbs[verbKey].conjugations).filter(f=>f!==correctForm); shuffle(sameVerbForms);
      const otherVerbKeys = Object.keys(verbs).filter(k=>k!==verbKey);
      const otherForms = [].concat(...otherVerbKeys.map(k=>Object.values(verbs[k].conjugations))); shuffle(otherForms);
      if(sameVerbForms.length>0) opts.add(sameVerbForms.shift());
      if(otherForms.length>0) opts.add(otherForms.shift());
      while(opts.size<optionCount && sameVerbForms.length>0) opts.add(sameVerbForms.shift());
      while(opts.size<optionCount && otherForms.length>0) opts.add(otherForms.shift());
      const allForms = [].concat(...Object.keys(verbs).map(k=>Object.values(verbs[k].conjugations)));
      while(opts.size<optionCount){ const pick = allForms[Math.floor(Math.random()*allForms.length)]; opts.add(pick); }
      return shuffle(Array.from(opts));
    }

    const conjugationToInfinitive = Object.values(verbs).reduce((acc, verb) => {
      for (const form of Object.values(verb.conjugations)) {
        acc[form.toLowerCase()] = verb.infinitive;
      }
      return acc;
    }, {});

    // Safeguard: strips pronouns and coerces conjugated forms back to infinitives.
    function sanitizeVocabAnswer(ruWord) {
      const cleaned = ruWord
        .trim()
        .replace(/^(Я|Ты|Он|Она|Оно|Мы|Вы|Они)\s+/i, '')
        .replace(/[.,!?;:]+$/g, '')
        .trim();

      const lowered = cleaned.toLowerCase();
      return conjugationToInfinitive[lowered] || lowered;
    }

    function toDisplayCase(ruWord) {
      if (!ruWord) return ruWord;
      return ruWord.charAt(0).toUpperCase() + ruWord.slice(1);
    }

    function normalizeAudioKey(text){
      return (text || '')
        .toString()
        .trim()
        .toLowerCase()
        .replace(/\s+/g, ' ');
    }

    async function loadAudioManifest(){
      try{
        const response = await fetch(AUDIO_MANIFEST_URL, { cache: 'no-store' });
        if(!response.ok) return;
        const manifest = await response.json();
        audioByText = manifest.byText && typeof manifest.byText === 'object' ? manifest.byText : {};
      }catch(e){
        console.warn('Audio manifest unavailable', e);
      }
    }

    function getAudioPathForText(text){
      const key = normalizeAudioKey(text);
      return audioByText[key] || null;
    }

    function setMuteState(isMuted, persist = true){
      audioMuted = Boolean(isMuted);
      if(muteBtn){
        muteBtn.innerHTML = `<span class="icon">${audioMuted ? '🔇' : '🔊'}</span>`;
        muteBtn.setAttribute('aria-pressed', String(!audioMuted));
        muteBtn.setAttribute('aria-label', audioMuted ? 'Unmute audio' : 'Mute audio');
        muteBtn.setAttribute('title', audioMuted ? 'Unmute audio' : 'Mute audio');
      }
      if(audioMuted && currentAudio){
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      if(persist){
        try{ localStorage.setItem(AUDIO_MUTE_KEY, String(audioMuted)); }
        catch(e){ console.warn('Failed to save mute state', e); }
      }
    }

    function getPlaybackRate(){
      return audioSlow ? 0.8 : 1;
    }

    function setSlowState(isSlow, persist = true){
      audioSlow = Boolean(isSlow);
      if(speedBtn){
        speedBtn.innerHTML = `<span class="icon">${audioSlow ? '½×' : '1×'}</span>`;
        speedBtn.setAttribute('aria-pressed', String(audioSlow));
        speedBtn.setAttribute('aria-label', audioSlow ? 'Use normal playback speed' : 'Use slower playback speed');
        speedBtn.setAttribute('title', audioSlow ? 'Slow playback enabled' : 'Normal playback');
      }
      if(currentAudio){
        currentAudio.playbackRate = getPlaybackRate();
      }
      if(persist){
        try{ localStorage.setItem(AUDIO_SLOW_KEY, String(audioSlow)); }
        catch(e){ console.warn('Failed to save slow state', e); }
      }
    }

    function playAudioForText(text, { restart = true } = {}){
      if(audioMuted) return;
      const src = getAudioPathForText(text);
      if(!src) return;
      if(currentAudio && restart){
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      if(currentAudio && !restart && !currentAudio.paused){
        return;
      }
      currentAudio = new Audio(src);
      currentAudio.playbackRate = getPlaybackRate();
      currentAudio.play().catch(() => {});
    }

    const normalizedVocabulary = vocabulary
      .map((item) => {
        const normalizedRu = sanitizeVocabAnswer(item.ru);
        if (!normalizedRu) return null;
        return { ru: toDisplayCase(normalizedRu), en: item.en };
      })
      .filter(Boolean);

    const fallbackVocabulary = Object.entries(verbGloss)
      .map(([infinitive, en]) => ({ ru: toDisplayCase(infinitive), en }));

    const vocabularyPool = normalizedVocabulary.length >= 4 ? normalizedVocabulary : fallbackVocabulary;

    let currentAnswer = null;
    function showQuestion(focus=true){
      optionsEl.innerHTML = '';
      lastResultEl.textContent = '—';
      const mode = quizType?.value || 'pronouns';

      if(mode === 'numbers'){
        const keys = Object.keys(numbers).map(k=>Number(k));
        const numberItems = keys.map(n => ({ key: `numbers:${n}`, number: n, value: numbers[n] }));
        const chosenItem = pickWeightedQuestion(numberItems, lastQuestionKey);
        const n = chosenItem.number;
        const correctForm = numbers[n];
        currentAnswer = { mode:'numbers', number:n, correctForm, questionKey: chosenItem.key };
        lastQuestionKey = chosenItem.key;
        currentPromptAudioText = correctForm;
        promptEl.textContent = String(n);
        promptEl.setAttribute('aria-live','polite');
        const opts = new Set([correctForm]);
        const otherKeys = keys.filter(k=>k!==n); shuffle(otherKeys);
        for(const k of otherKeys){ opts.add(numbers[k]); if(opts.size>=4) break; }
        const options = shuffle(Array.from(opts));
        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          btn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); } });
          optionsEl.appendChild(btn);
        }
      } else if(mode === 'vocabulary'){
        // Pick weighted item by question performance and avoid immediate repeats.
        const vocabItems = vocabularyPool.map(v => ({ key: `vocabulary:${v.ru.toLowerCase()}`, item: v }));
        const chosenItem = pickWeightedQuestion(vocabItems, lastQuestionKey);
        const rawItem = chosenItem.item;
        currentAnswer = { mode:'vocabulary', en:rawItem.en, correctForm:rawItem.ru, questionKey: chosenItem.key };
        lastQuestionKey = chosenItem.key;
        currentPromptAudioText = rawItem.ru;
        promptEl.textContent = rawItem.en;
        promptEl.setAttribute('aria-live','polite');

        const opts = new Set([rawItem.ru]);
        const otherRussian = shuffle(vocabularyPool.filter(v=>v.en !== rawItem.en).map(v=>v.ru));
        for(const rw of otherRussian){ opts.add(rw); if(opts.size >= 4) break; }
        const options = shuffle(Array.from(opts));

        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          btn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); } });
          optionsEl.appendChild(btn);
        }
      } else {
        const selectedVerbs = getSelectedVerbs();
        const pronounKeys = Object.keys(pronouns);
        const pronounVerbItems = [];
        for(const verbKey of selectedVerbs){
          for(const pronounKey of pronounKeys){
            pronounVerbItems.push({ key: `pronouns:${verbKey}:${pronounKey}`, verbKey, pronounKey });
          }
        }
        const chosenItem = pickWeightedQuestion(pronounVerbItems, lastQuestionKey);
        const verbKey = chosenItem.verbKey;
        const pronounKey = chosenItem.pronounKey;
        const conjKey = pronounToConjKey(pronounKey);
        const correctForm = verbs[verbKey].conjugations[conjKey];
        currentAnswer = { mode:'pronouns', verbKey, pronounKey, correctForm, conjKey, questionKey: chosenItem.key };
        lastQuestionKey = chosenItem.key;
        currentPromptAudioText = verbKey;
        promptEl.textContent = buildPrompt(pronounKey, verbKey);
        promptEl.setAttribute('aria-live','polite');
        const options = makeOptions(correctForm, verbKey, 4);
        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          btn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); } });
          optionsEl.appendChild(btn);
        }
      }

      const first = optionsEl.querySelector('.option-btn');
      if(focus && first) first.focus();
    }

    function handleAnswer(button){
      const all = Array.from(optionsEl.querySelectorAll('.option-btn'));
      for(const b of all){ b.disabled = true; b.setAttribute('aria-pressed','true'); }
      const chosen = button.getAttribute('data-form');
      const correct = currentAnswer.correctForm;
      const isCorrect = chosen === correct;
      const fallbackPronounAudio = currentAnswer.mode === 'pronouns' ? currentAnswer.verbKey : null;
      const playbackText = getAudioPathForText(correct) ? correct : (fallbackPronounAudio || correct);
      if(isCorrect){ button.classList.add('correct'); tally.correct += 1; lastResultEl.textContent = 'Correct ✓'; }
      else {
        button.classList.add('wrong');
        const correctBtn = all.find(b=>b.getAttribute('data-form')===correct);
        if(correctBtn) correctBtn.classList.add('correct');
        tally.incorrect += 1; lastResultEl.textContent = 'Incorrect ✗';
      }
      playAudioForText(playbackText);
      if(currentAnswer && currentAnswer.questionKey) updateQuestionStat(currentAnswer.questionKey, isCorrect);
      tally.attempts += 1; renderTally(); saveState();
      setTimeout(()=> showQuestion(true), 800);
    }

    muteBtn.addEventListener('click', ()=> setMuteState(!audioMuted));
    playAudioBtn.addEventListener('click', ()=>{
      const promptText = currentPromptAudioText || (currentAnswer ? currentAnswer.correctForm : '');
      playAudioForText(promptText, { restart: false });
    });
    replayAudioBtn.addEventListener('click', ()=>{
      const promptText = currentPromptAudioText || (currentAnswer ? currentAnswer.correctForm : '');
      playAudioForText(promptText, { restart: true });
    });
    speedBtn.addEventListener('click', ()=>{
      setSlowState(!audioSlow);
      const promptText = currentPromptAudioText || (currentAnswer ? currentAnswer.correctForm : '');
      if(currentAudio && !currentAudio.paused){
        playAudioForText(promptText, { restart: true });
      }
    });
    nextBtn.addEventListener('click', ()=> showQuestion(true));
    quizType.addEventListener('change', ()=> showQuestion(true));
    resetBtn.addEventListener('click', openResetModal);
    resetCancelBtn.addEventListener('click', closeResetModal);
    resetConfirmBtn.addEventListener('click', confirmReset);
    resetModalEl.addEventListener('click', (event)=>{
      if(event.target === resetModalEl) closeResetModal();
    });
    document.addEventListener('keydown', (event)=>{
      if(event.key === 'Escape' && !resetModalEl.hidden){
        closeResetModal();
      }
    });

    (function init(){
      loadState();
      loadAudioManifest();
      const storedMute = localStorage.getItem(AUDIO_MUTE_KEY);
      setMuteState(storedMute === null ? true : storedMute === 'true', false);
      const storedSlow = localStorage.getItem(AUDIO_SLOW_KEY);
      setSlowState(storedSlow === null ? true : storedSlow === 'true', false);
      renderTally();
      if(buildStampEl) buildStampEl.textContent = `Last updated: ${APP_LAST_UPDATED}`;
      setTimeout(()=> showQuestion(true), 120);
    })();
    window._russianConj = { verbs, pronouns, showQuestion, resetState };
  </script>
