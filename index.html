<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Russian Drills</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --btn: #334155;
      --btn-hover: #475569;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    select, button {
      background: var(--btn);
      color: var(--text);
      border: 1px solid #475569;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
    }
    select:hover, button:hover { background: var(--btn-hover); }
    button:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; }
    button.correct { background: var(--correct) !important; color: #052e16; font-weight: 600; }
    button.wrong { background: var(--wrong) !important; color: #450a0a; font-weight: 600; }

    .prompt {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      padding: 20px;
      background: rgba(56,189,248,0.1);
      border-radius: 12px;
      margin: 16px 0;
      min-height: 64px;
      display: grid;
      place-items: center;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .option-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      text-align: center;
    }

    .tally {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-top: 20px;
      text-align: center;
      font-size: 0.95rem;
    }
    .tally div {
      background: rgba(148,163,184,0.15);
      padding: 10px 6px;
      border-radius: 8px;
    }
    .tally .label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .tally .value {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .last-result {
      text-align: center;
      margin-top: 12px;
      font-weight: 600;
      min-height: 24px;
      color: var(--accent);
    }

    .build-stamp {
      margin-top: 14px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      opacity: 0.9;
    }

    @media (max-width: 520px) {
      .options { grid-template-columns: 1fr; }
      .tally { grid-template-columns: repeat(2, 1fr); }
      header { flex-direction: column; align-items: stretch; }
      .controls { justify-content: center; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>Russian Drills</h1>
      <div class="controls">
        <select id="quiz-type" aria-label="Quiz type">
          <option value="pronouns">Verb conjugations</option>
          <option value="numbers">Numbers 0–20</option>
          <option value="vocabulary">Vocabulary</option>
        </select>
        <button id="next-btn" type="button">New Question</button>
        <button id="reset-btn" type="button">Reset Tally</button>
      </div>
    </header>

    <div id="prompt" class="prompt" role="status" aria-live="polite">Loading…</div>
    <div id="options" class="options" role="group" aria-label="Answer choices"></div>
    <div id="last-result" class="last-result" aria-live="polite">—</div>

    <div class="tally" aria-label="Progress tally">
      <div><span class="label">Correct</span><span class="value" id="correct">0</span></div>
      <div><span class="label">Incorrect</span><span class="value" id="incorrect">0</span></div>
      <div><span class="label">Attempts</span><span class="value" id="attempts">0</span></div>
      <div><span class="label">Last result</span><span class="value" id="last-result-tally">—</span></div>
    </div>

    <div id="build-stamp" class="build-stamp" aria-live="polite">Last updated: loading...</div>
  </div>

  <script>
    // Russian verbs and pronouns data model
    const verbs = {
      "думать":{ infinitive: "думать", conjugations: { ya: "думаю", ty: "думаешь", on: "думает", my: "думаем", vy: "думаете", oni: "думают" }},
      "отдыхать":{ infinitive: "отдыхать", conjugations: { ya: "отдыхаю", ty: "отдыхаешь", on: "отдыхает", my: "отдыхаем", vy: "отдыхаете", oni: "отдыхают" }},
      "гулять":{ infinitive: "гулять", conjugations: { ya: "гуляю", ty: "гуляешь", on: "гуляет", my: "гуляем", vy: "гуляете", oni: "гуляют" }},
      "уметь":{ infinitive: "уметь", conjugations: { ya: "умею", ty: "умеешь", on: "умеет", my: "умеем", vy: "умеете", oni: "умеют" }},
      "читать":{ infinitive: "читать", conjugations: { ya: "читаю", ty: "читаешь", on: "читает", my: "читаем", vy: "читаете", oni: "читают" }},
      "работать":{ infinitive: "работать", conjugations: { ya: "работаю", ty: "работаешь", on: "работает", my: "работаем", vy: "работаете", oni: "работают" }},
      "говорить":{ infinitive: "говорить", conjugations: { ya: "говорю", ty: "говоришь", on: "говорит", my: "говорим", vy: "говорите", oni: "говорят" }},
      "ужинать":{ infinitive: "ужинать", conjugations: { ya: "ужинаю", ty: "ужинаешь", on: "ужинает", my: "ужинаем", vy: "ужинаете", oni: "ужинают" }},
      "мечтать":{ infinitive: "мечтать", conjugations: { ya: "мечтаю", ty: "мечтаешь", on: "мечтает", my: "мечтаем", vy: "мечтаете", oni: "мечтают" }},
      "знать":{ infinitive: "знать", conjugations: { ya: "знаю", ty: "знаешь", on: "знает", my: "знаем", vy: "знаете", oni: "знают" }},
      "жить":{ infinitive: "жить", conjugations: { ya: "живу", ty: "живёшь", on: "живёт", my: "живём", vy: "живёте", oni: "живут" }},
      "понимать":{ infinitive: "понимать", conjugations: { ya: "понимаю", ty: "понимаешь", on: "понимает", my: "понимаем", vy: "понимаете", oni: "понимают" }},
      "писать":{ infinitive: "писать", conjugations: { ya: "пишу", ty: "пишешь", on: "пишет", my: "пишем", vy: "пишете", oni: "пишут" }},
      "играть":{ infinitive: "играть", conjugations: { ya: "играю", ty: "играешь", on: "играет", my: "играем", vy: "играете", oni: "играют" }},
      "учиться":{ infinitive: "учиться", conjugations: { ya: "учусь", ty: "учишься", on: "учится", my: "учимся", vy: "учитесь", oni: "учатся" }},
      "мочь":{ infinitive: "мочь", conjugations: { ya: "могу", ty: "можешь", on: "может", my: "можем", vy: "можете", oni: "могут" }},
      "делать":{ infinitive: "делать", conjugations: { ya: "делаю", ty: "делаешь", on: "делает", my: "делаем", vy: "делаете", oni: "делают" }},
      "обедать":{ infinitive: "обедать", conjugations: { ya: "обедаю", ty: "обедаешь", on: "обедает", my: "обедаем", vy: "обедаете", oni: "обедают" }},
      "танцевать":{ infinitive: "танцевать", conjugations: { ya: "танцую", ty: "танцуешь", on: "танцует", my: "танцуем", vy: "танцуете", oni: "танцуют" }},
      "завтракать":{ infinitive: "завтракать", conjugations: { ya: "завтракаю", ty: "завтракаешь", on: "завтракает", my: "завтракаем", vy: "завтракаете", oni: "завтракают" }},
      "спать":{ infinitive: "спать", conjugations: { ya: "сплю", ty: "спишь", on: "спит", my: "спим", vy: "спите", oni: "спят" }}
    };

    const pronouns = {
      ya: { translit: "Ya", cyr: "Я" }, ty: { translit: "Ty", cyr: "Ты" }, on: { translit: "On", cyr: "Он" },
      ona: { translit: "Ona", cyr: "Она" }, ono: { translit: "Ono", cyr: "Оно" }, my: { translit: "My", cyr: "Мы" },
      vy: { translit: "Vy", cyr: "Вы" }, oni:{ translit: "Oni", cyr: "Они" }
    };

    const numbers = {
      0: 'ноль', 1: 'один', 2: 'два', 3: 'три', 4: 'четыре', 5: 'пять', 6: 'шесть', 7: 'семь',
      8: 'восемь', 9: 'девять', 10: 'десять', 11: 'одиннадцать', 12: 'двенадцать', 13: 'тринадцать',
      14: 'четырнадцать', 15: 'пятнадцать', 16: 'шестнадцать', 17: 'семнадцать', 18: 'восемнадцать',
      19: 'девятнадцать', 20: 'двадцать'
    };

    // Vocabulary list updated to use ONLY base/infinitive forms. 
    // Pronoun-prefixed phrases replaced with their dictionary forms to guarantee no conjugations appear.
    const vocabulary = [
      { ru: 'Думать', en: 'To think' },
      { ru: 'Понимать', en: 'To understand' },
      { ru: 'Танцевать', en: 'To dance' },
      { ru: 'Работать', en: 'To work' },
      { ru: 'Гулять', en: 'To go for a walk' },
      { ru: 'Завтракать', en: 'To have breakfast' },
      { ru: 'Спать', en: 'To sleep' },
      { ru: 'Обедать', en: 'To have lunch' },
      { ru: 'Говорить', en: 'To speak' },
      { ru: 'Мечтать', en: 'To dream about' },
      { ru: 'Мочь', en: 'To be able to / can' },
      { ru: 'Учиться', en: 'To study' },
      { ru: 'Уметь', en: 'To know how to do something' },
      { ru: 'Писать', en: 'To write' },
      { ru: 'Знать', en: 'To know' },
      { ru: 'Отдыхать', en: 'To relax, to rest' },
      { ru: 'Играть', en: 'To play' },
      { ru: 'Жить', en: 'To live' }
    ];

    const verbGloss = {
      думать: 'To think', отдыхать: 'To relax, to rest', гулять: 'To go for a walk', уметь: 'To know how to do something',
      читать: 'To read', работать: 'To work', говорить: 'To speak', ужинать: 'To have dinner', мечтать: 'To dream about',
      знать: 'To know', жить: 'To live', понимать: 'To understand', писать: 'To write', играть: 'To play',
      учиться: 'To study', мочь: 'To be able to / can', делать: 'To do', обедать: 'To have lunch', танцевать: 'To dance',
      завтракать: 'To have breakfast', спать: 'To sleep'
    };

    const STORAGE_KEY = 'russian-conj-tally-v1';
    const APP_LAST_UPDATED = '2026-05-24 22:25 UTC';
    let tally = { correct:0, incorrect:0, attempts:0 };

    const quizType = document.getElementById('quiz-type');
    const nextBtn = document.getElementById('next-btn');
    const resetBtn = document.getElementById('reset-btn');
    const promptEl = document.getElementById('prompt');
    const optionsEl = document.getElementById('options');
    const correctEl = document.getElementById('correct');
    const incorrectEl = document.getElementById('incorrect');
    const attemptsEl = document.getElementById('attempts');
    const lastResultEl = document.getElementById('last-result');
    const lastResultTallyEl = document.getElementById('last-result-tally');
    const buildStampEl = document.getElementById('build-stamp');

    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

    function loadState(){ try{ const raw = localStorage.getItem(STORAGE_KEY); if(raw){ const parsed = JSON.parse(raw); tally = Object.assign(tally, parsed); } }catch(e){ console.warn('Failed to load state', e); } }
    function saveState(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tally)); }catch(e){ console.warn('Failed to save state', e); } }
    function resetState(){ tally = { correct:0, incorrect:0, attempts:0 }; saveState(); renderTally(); }
    function renderTally(){ correctEl.textContent = tally.correct; incorrectEl.textContent = tally.incorrect; attemptsEl.textContent = tally.attempts; lastResultTallyEl.textContent = '—'; }

    function getSelectedVerbs(){ return Object.keys(verbs); }
    function buildPrompt(pronounKey, verbKey){
      const pron = pronouns[pronounKey].cyr;
      const gloss = verbGloss[verbKey] ? ` (${verbGloss[verbKey]})` : '';
      return `${pron} — ${verbKey}${gloss}`;
    }
    function pronounToConjKey(pronKey){ if(pronKey === 'ona' || pronKey === 'ono') return 'on'; return pronKey; }

    function makeOptions(correctForm, verbKey, optionCount = 4){
      const opts = new Set(); opts.add(correctForm);
      const sameVerbForms = Object.values(verbs[verbKey].conjugations).filter(f=>f!==correctForm); shuffle(sameVerbForms);
      const otherVerbKeys = Object.keys(verbs).filter(k=>k!==verbKey);
      const otherForms = [].concat(...otherVerbKeys.map(k=>Object.values(verbs[k].conjugations))); shuffle(otherForms);
      if(sameVerbForms.length>0) opts.add(sameVerbForms.shift());
      if(otherForms.length>0) opts.add(otherForms.shift());
      while(opts.size<optionCount && sameVerbForms.length>0) opts.add(sameVerbForms.shift());
      while(opts.size<optionCount && otherForms.length>0) opts.add(otherForms.shift());
      const allForms = [].concat(...Object.keys(verbs).map(k=>Object.values(verbs[k].conjugations)));
      while(opts.size<optionCount){ const pick = allForms[Math.floor(Math.random()*allForms.length)]; opts.add(pick); }
      return shuffle(Array.from(opts));
    }

    const conjugationToInfinitive = Object.values(verbs).reduce((acc, verb) => {
      for (const form of Object.values(verb.conjugations)) {
        acc[form.toLowerCase()] = verb.infinitive;
      }
      return acc;
    }, {});

    // Safeguard: strips pronouns and coerces conjugated forms back to infinitives.
    function sanitizeVocabAnswer(ruWord) {
      const cleaned = ruWord
        .trim()
        .replace(/^(Я|Ты|Он|Она|Оно|Мы|Вы|Они)\s+/i, '')
        .replace(/[.,!?;:]+$/g, '')
        .trim();

      const lowered = cleaned.toLowerCase();
      return conjugationToInfinitive[lowered] || lowered;
    }

    function toDisplayCase(ruWord) {
      if (!ruWord) return ruWord;
      return ruWord.charAt(0).toUpperCase() + ruWord.slice(1);
    }

    const allowedInfinitives = new Set(Object.values(verbs).map((verb) => verb.infinitive));

    const normalizedVocabulary = vocabulary
      .map((item) => {
        const normalizedRu = sanitizeVocabAnswer(item.ru);
        if (!allowedInfinitives.has(normalizedRu)) return null;
        return { ru: toDisplayCase(normalizedRu), en: item.en };
      })
      .filter(Boolean);

    const fallbackVocabulary = Object.entries(verbGloss)
      .filter(([infinitive]) => allowedInfinitives.has(infinitive))
      .map(([infinitive, en]) => ({ ru: toDisplayCase(infinitive), en }));

    const vocabularyPool = normalizedVocabulary.length >= 4 ? normalizedVocabulary : fallbackVocabulary;

    let currentAnswer = null;
    function showQuestion(focus=true){
      optionsEl.innerHTML = '';
      lastResultEl.textContent = '—';
      const mode = quizType?.value || 'pronouns';

      if(mode === 'numbers'){
        const keys = Object.keys(numbers).map(k=>Number(k));
        const n = keys[Math.floor(Math.random()*keys.length)];
        const correctForm = numbers[n];
        currentAnswer = { mode:'numbers', number:n, correctForm };
        promptEl.textContent = String(n);
        promptEl.setAttribute('aria-live','polite');
        const opts = new Set([correctForm]);
        const otherKeys = keys.filter(k=>k!==n); shuffle(otherKeys);
        for(const k of otherKeys){ opts.add(numbers[k]); if(opts.size>=4) break; }
        const options = shuffle(Array.from(opts));
        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          btn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); } });
          optionsEl.appendChild(btn);
        }
      } else if(mode === 'vocabulary'){
        // Pick random item, sanitize to guarantee base form only
        const rawItem = vocabularyPool[Math.floor(Math.random()*vocabularyPool.length)];
        currentAnswer = { mode:'vocabulary', en:rawItem.en, correctForm:rawItem.ru };
        promptEl.textContent = rawItem.en;
        promptEl.setAttribute('aria-live','polite');

        const opts = new Set([rawItem.ru]);
        const otherRussian = shuffle(vocabularyPool.filter(v=>v.en !== rawItem.en).map(v=>v.ru));
        for(const rw of otherRussian){ opts.add(rw); if(opts.size >= 4) break; }
        const options = shuffle(Array.from(opts));

        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          btn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); } });
          optionsEl.appendChild(btn);
        }
      } else {
        const selectedVerbs = getSelectedVerbs();
        const verbKey = selectedVerbs[Math.floor(Math.random()*selectedVerbs.length)];
        const pronounKeys = Object.keys(pronouns);
        const pronounKey = pronounKeys[Math.floor(Math.random()*pronounKeys.length)];
        const conjKey = pronounToConjKey(pronounKey);
        const correctForm = verbs[verbKey].conjugations[conjKey];
        currentAnswer = { mode:'pronouns', verbKey, pronounKey, correctForm, conjKey };
        promptEl.textContent = buildPrompt(pronounKey, verbKey);
        promptEl.setAttribute('aria-live','polite');
        const options = makeOptions(correctForm, verbKey, 4);
        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          btn.addEventListener('keydown', (e)=>{ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); btn.click(); } });
          optionsEl.appendChild(btn);
        }
      }

      const first = optionsEl.querySelector('.option-btn');
      if(focus && first) first.focus();
    }

    function handleAnswer(button){
      const all = Array.from(optionsEl.querySelectorAll('.option-btn'));
      for(const b of all){ b.disabled = true; b.setAttribute('aria-pressed','true'); }
      const chosen = button.getAttribute('data-form');
      const correct = currentAnswer.correctForm;
      if(chosen === correct){ button.classList.add('correct'); tally.correct += 1; lastResultEl.textContent = 'Correct ✓'; }
      else {
        button.classList.add('wrong');
        const correctBtn = all.find(b=>b.getAttribute('data-form')===correct);
        if(correctBtn) correctBtn.classList.add('correct');
        tally.incorrect += 1; lastResultEl.textContent = 'Incorrect ✗';
      }
      tally.attempts += 1; renderTally(); saveState();
      setTimeout(()=> showQuestion(true), 800);
    }

    nextBtn.addEventListener('click', ()=> showQuestion(true));
    quizType.addEventListener('change', ()=> showQuestion(true));
    resetBtn.addEventListener('click', ()=>{
      const ok = confirm('Reset tally? This will clear stored correct/incorrect/attempts.');
      if(ok){ resetState(); lastResultEl.textContent = '—'; }
    });

    (function init(){
      loadState();
      renderTally();
      if(buildStampEl) buildStampEl.textContent = `Last updated: ${APP_LAST_UPDATED}`;
      setTimeout(()=> showQuestion(true), 120);
    })();
    window._russianConj = { verbs, pronouns, showQuestion, resetState };
  </script>
</body>
</html>
