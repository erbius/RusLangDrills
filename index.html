<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Russian Drills</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --correct: #22c55e;
      --wrong: #ef4444;
      --btn: #334155;
      --btn-hover: #475569;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: grid;
      place-items: center;
      min-height: 100vh;
      padding: 24px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 {
      margin: 0;
      font-size: 1.5rem;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    #mute-btn[aria-pressed="true"] {
      background: #0f3d2e;
      border-color: #1f6f52;
    }
    select, button {
      background: var(--btn);
      color: var(--text);
      border: 1px solid #475569;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.05s;
      touch-action: manipulation;
    }
    select:hover, button:hover { background: var(--btn-hover); }
    button:active { transform: translateY(1px); }
    button[disabled] { opacity: 0.6; cursor: not-allowed; }
    button.correct { background: var(--correct) !important; color: #052e16; font-weight: 600; }
    button.wrong { background: var(--wrong) !important; color: #450a0a; font-weight: 600; }

    .prompt {
      font-size: 1.4rem;
      font-weight: 600;
      text-align: center;
      padding: 20px;
      background: rgba(56,189,248,0.1);
      border-radius: 12px;
      margin: 16px 0;
      min-height: 64px;
      display: grid;
      place-items: center;
    }
    .prompt-wrap {
      display: grid;
      gap: 8px;
      margin: 16px 0;
    }
    .prompt-wrap .prompt {
      margin: 0;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .audio-controls {
      display: flex;
      gap: 4px;
      align-items: center;
      justify-content: center;
    }
    .play-btn {
      min-width: 26px;
      min-height: 26px;
      padding: 0;
      font-size: 0.7rem;
      font-weight: 500;
      border-radius: 999px;
      opacity: 0.74;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .play-btn:hover { opacity: 1; }
    .play-btn .icon {
      line-height: 1;
      display: inline-block;
    }
    .speed-btn[aria-pressed="true"] {
      background: #312e81;
      border-color: #6366f1;
      opacity: 1;
    }

    .options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin: 16px 0;
    }
    .option-btn {
      width: 100%;
      padding: 14px;
      font-size: 1.1rem;
      text-align: center;
    }

    .tally {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
      text-align: center;
      font-size: 0.95rem;
    }
    .tally div {
      background: rgba(148,163,184,0.15);
      padding: 10px 6px;
      border-radius: 8px;
    }
    .tally .label {
      display: block;
      font-size: 0.8rem;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .tally .value {
      font-weight: 700;
      font-size: 1.1rem;
    }

    .last-result {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: 12px;
      min-height: 24px;
    }

    .build-stamp {
      margin-top: 14px;
      text-align: center;
      font-size: 0.82rem;
      color: var(--muted);
      opacity: 0.9;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(2, 6, 23, 0.78);
      z-index: 20;
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal {
      width: min(100%, 360px);
      background: #162033;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 18px;
      box-shadow: 0 18px 48px rgba(0,0,0,0.42);
    }
    .modal h2 {
      margin: 0 0 10px;
      font-size: 1.05rem;
    }
    .modal p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }
    .modal-actions .danger-btn {
      background: #7f1d1d;
      border-color: #b91c1c;
    }
    .modal-actions .danger-btn:hover {
      background: #991b1b;
    }

    @media (max-width: 520px) {
      body {
        padding: 12px;
        place-items: stretch;
      }
      .app {
        border-radius: 14px;
        padding: 16px;
      }
      header {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }
      h1 {
        text-align: center;
        font-size: 1.35rem;
      }
      .controls {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .controls select {
        grid-column: 1 / -1;
        text-align: center;
        text-align-last: center;
      }
      .controls select,
      .controls button {
        width: 100%;
        min-height: 44px;
      }
      .prompt {
        min-height: 56px;
        padding: 16px;
        font-size: 1.2rem;
      }
      .options { grid-template-columns: 1fr; }
      .option-btn {
        min-height: 52px;
        font-size: 1rem;
      }
      .tally { grid-template-columns: 1fr; }
      .play-btn {
        min-width: 30px;
        min-height: 30px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1></h1>
      <div class="controls">
        <select id="quiz-type"></select>
        <button id="next-btn" type="button"></button>
        <button id="reset-btn" type="button"></button>
      </div>
    </header>

    <div class="prompt-wrap">
      <div id="prompt" class="prompt" role="status" aria-live="polite"></div>
    </div>
    <div id="options" class="options" role="group"></div>
    <div class="last-result">
      <div class="audio-controls">
        <button id="mute-btn" class="play-btn" type="button" aria-pressed="false"><span class="icon">🔇</span></button>
        <button id="play-audio-btn" class="play-btn" type="button"><span class="icon">▶</span></button>
        <button id="replay-audio-btn" class="play-btn" type="button"><span class="icon">↺</span></button>
        <button id="speed-btn" class="play-btn speed-btn" type="button" aria-pressed="false"><span class="icon">0.8×</span></button>
      </div>
      <div id="last-result" class="sr-only" aria-live="polite"></div>
    </div>

    <div class="tally">
      <div><span class="label"></span><span class="value" id="correct">0</span></div>
      <div><span class="label"></span><span class="value" id="incorrect">0</span></div>
      <div><span class="label"></span><span class="value" id="attempts">0</span></div>
    </div>

    <div id="build-stamp" class="build-stamp" aria-live="polite"></div>
  </div>

  <div id="reset-modal" class="modal-backdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="reset-modal-title" aria-describedby="reset-modal-text">
      <h2 id="reset-modal-title"></h2>
      <p id="reset-modal-text"></p>
      <div class="modal-actions">
        <button id="reset-cancel-btn" type="button"></button>
        <button id="reset-confirm-btn" class="danger-btn" type="button"></button>
      </div>
    </div>
  </div>

<script>
    let verbs = {};
    let pronouns = {};
    let numbers = {};
    let vocabulary = [];
    let verbGloss = {};
    let config = {};
    let ui = {};

    async function loadDataFromJSON(){
      try{
        const response = await fetch('data.json', { cache: 'no-store' });
        if(!response.ok) throw new Error(`Failed to load data: ${response.status}`);
        const data = await response.json();
        verbs = data.verbs || {};
        pronouns = data.pronouns || {};
        numbers = data.numbers || {};
        vocabulary = data.vocabulary || [];
        verbGloss = data.verbGloss || {};
        config = data.config || {};
        ui = data.ui || {};
      }catch(e){
        console.error('Failed to load data.json:', e);
        throw e;
      }
    }

    let STORAGE_KEY, QUESTION_STATS_KEY, AUDIO_MUTE_KEY, AUDIO_SLOW_KEY, AUDIO_MANIFEST_URL, APP_LAST_UPDATED;
    
    let tally = { correct:0, incorrect:0, attempts:0 };
    let questionStats = {};
    let lastQuestionKey = null;
    let audioByText = {};
    let audioMuted = true;
    let audioSlow = true;
    
    const audioPlayer = new Audio();
    let currentAudioSrc = '';
    let currentPromptAudioText = '';

    const quizType = document.getElementById('quiz-type');
    const muteBtn = document.getElementById('mute-btn');
    const nextBtn = document.getElementById('next-btn');
    const resetBtn = document.getElementById('reset-btn');
    const playAudioBtn = document.getElementById('play-audio-btn');
    const replayAudioBtn = document.getElementById('replay-audio-btn');
    const speedBtn = document.getElementById('speed-btn');
    const promptEl = document.getElementById('prompt');
    const optionsEl = document.getElementById('options');
    const correctEl = document.getElementById('correct');
    const incorrectEl = document.getElementById('incorrect');
    const attemptsEl = document.getElementById('attempts');
    const lastResultEl = document.getElementById('last-result');
    const buildStampEl = document.getElementById('build-stamp');
    const resetModalEl = document.getElementById('reset-modal');
    const resetCancelBtn = document.getElementById('reset-cancel-btn');
    const resetConfirmBtn = document.getElementById('reset-confirm-btn');
    let resetModalReturnFocus = null;

    function shuffle(arr){ for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }

    function loadState(){
      try{
        const raw = localStorage.getItem(STORAGE_KEY);
        if(raw){ const parsed = JSON.parse(raw); tally = Object.assign(tally, parsed); }
      }catch(e){ console.warn('Failed to load state', e); }
      try{
        const rawQuestionStats = localStorage.getItem(QUESTION_STATS_KEY);
        if(rawQuestionStats){
          const parsedQuestionStats = JSON.parse(rawQuestionStats);
          if(parsedQuestionStats && typeof parsedQuestionStats === 'object') questionStats = parsedQuestionStats;
        }
      }catch(e){ console.warn('Failed to load question stats', e); }
    }

    function saveState(){
      try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(tally)); }catch(e){ console.warn('Failed to save state', e); }
      const keys = Object.keys(questionStats);
      if (keys.length > 500) {
        keys.slice(0, 250).forEach(k => delete questionStats[k]); 
      }
      
      try{ localStorage.setItem(QUESTION_STATS_KEY, JSON.stringify(questionStats)); }
      catch(e){ console.warn('Failed to save question stats', e); }
    }

    function resetState(){ tally = { correct:0, incorrect:0, attempts:0 }; questionStats = {}; lastQuestionKey = null; saveState(); renderTally(); }
    function renderTally(){ correctEl.textContent = tally.correct; incorrectEl.textContent = tally.incorrect; attemptsEl.textContent = tally.attempts; }

    function openResetModal(){ resetModalReturnFocus = document.activeElement; resetModalEl.hidden = false; resetConfirmBtn.focus(); }
    function closeResetModal(){ resetModalEl.hidden = true; if(resetModalReturnFocus && typeof resetModalReturnFocus.focus === 'function'){ resetModalReturnFocus.focus(); } }
    function confirmReset(){ resetState(); lastResultEl.textContent = ui.messages.defaultResult; closeResetModal(); }

    function getQuestionStat(key){
      const stat = questionStats[key];
      if(!stat) return { correct:0, incorrect:0 };
      return { correct: Number(stat.correct) || 0, incorrect: Number(stat.incorrect) || 0 };
    }

    function updateQuestionStat(key, isCorrect){
      const stat = getQuestionStat(key);
      if(isCorrect) stat.correct += 1;
      else stat.incorrect += 1;
      questionStats[key] = stat;
    }

    function getQuestionWeight(questionKey){
      const stat = getQuestionStat(questionKey);
      const weight = 1 + (stat.incorrect * 3) - (stat.correct * 0.5);
      return Math.max(0.25, weight);
    }

    function pickWeightedQuestion(items, excludedKey){
      if(!Array.isArray(items) || items.length === 0) return null;
      const pool = items.filter(item => item.key !== excludedKey);
      const candidates = pool.length > 0 ? pool : items;
      let totalWeight = 0;
      for(const item of candidates){ totalWeight += getQuestionWeight(item.key); }
      if(totalWeight <= 0) return candidates[Math.floor(Math.random() * candidates.length)];
      let target = Math.random() * totalWeight;
      for(const item of candidates){ target -= getQuestionWeight(item.key); if(target <= 0) return item; }
      return candidates[candidates.length - 1];
    }

    function getSelectedVerbs(){ return Object.keys(verbs); }
    function buildPrompt(pronounKey, verbKey){ const pron = pronouns[pronounKey].cyr; return `${pron} — ${verbKey}`; }
    function pronounToConjKey(pronKey){ if(pronKey === 'ona' || pronKey === 'ono') return 'on'; return pronKey; }

    function makeOptions(correctForm, verbKey, optionCount = 4){
      const opts = new Set(); opts.add(correctForm);
      const sameVerbForms = Object.values(verbs[verbKey].conjugations).filter(f=>f!==correctForm); shuffle(sameVerbForms);
      const otherVerbKeys = Object.keys(verbs).filter(k=>k!==verbKey);
      const otherForms = [].concat(...otherVerbKeys.map(k=>Object.values(verbs[k].conjugations))); shuffle(otherForms);
      
      if(sameVerbForms.length>0) opts.add(sameVerbForms.shift());
      if(otherForms.length>0) opts.add(otherForms.shift());
      while(opts.size<optionCount && sameVerbForms.length>0) opts.add(sameVerbForms.shift());
      while(opts.size<optionCount && otherForms.length>0) opts.add(otherForms.shift());
      
      const allUniqueVerbForms = Array.from(new Set([].concat(...Object.keys(verbs).map(k=>Object.values(verbs[k].conjugations)))));
      const fallbackForms = [...allUniqueVerbForms];
      shuffle(fallbackForms);
      let idx = 0;
      while(opts.size < optionCount && idx < fallbackForms.length) {
        opts.add(fallbackForms[idx]);
        idx++;
      }
      return shuffle(Array.from(opts));
    }

    function getConjugationToInfinitive() {
      return Object.values(verbs).reduce((acc, verb) => {
        for (const form of Object.values(verb.conjugations)) { acc[form.toLowerCase()] = verb.infinitive; }
        return acc;
      }, {});
    }

    function sanitizeVocabAnswer(ruWord) {
      const cleaned = ruWord.trim().replace(/^(Я|Ты|Он|Она|Оно|Мы|Вы|Они)\s+/i, '').replace(/[.,!?;:]+$/g, '').trim();
      const lowered = cleaned.toLowerCase();
      const conjugationToInfinitive = getConjugationToInfinitive();
      return conjugationToInfinitive[lowered] || lowered;
    }

    function toDisplayCase(ruWord) { if (!ruWord) return ruWord; return ruWord.charAt(0).toUpperCase() + ruWord.slice(1); }
    function normalizeAudioKey(text){ return (text || '').toString().trim().toLowerCase().replace(/\s+/g, ' '); }

    async function loadAudioManifest(){
      try{
        const response = await fetch(AUDIO_MANIFEST_URL, { cache: 'no-store' });
        if(!response.ok) return;
        const manifest = await response.json();
        audioByText = manifest.byText && typeof manifest.byText === 'object' ? manifest.byText : {};
      }catch(e){ console.warn('Audio manifest unavailable', e); }
    }

    function getAudioPathForText(text){ const key = normalizeAudioKey(text); return audioByText[key] || null; }

    function setMuteState(isMuted, persist = true){
      audioMuted = Boolean(isMuted);
      if(muteBtn){
        muteBtn.innerHTML = `<span class="icon">${audioMuted ? '🔇' : '🔊'}</span>`;
        muteBtn.setAttribute('aria-pressed', String(!audioMuted));
        muteBtn.setAttribute('aria-label', audioMuted ? ui.labels.unmuteAudio : ui.labels.muteAudio);
        muteBtn.setAttribute('title', audioMuted ? ui.labels.unmuteAudio : ui.labels.muteAudio);
      }
      if(audioMuted){
        audioPlayer.pause();
        audioPlayer.currentTime = 0;
      }
      if(persist){
        try{ localStorage.setItem(AUDIO_MUTE_KEY, String(audioMuted)); }
        catch(e){ console.warn('Failed to save mute state', e); }
      }
    }

    function getPlaybackRate(){ return audioSlow ? 0.8 : 1; }

    function setSlowState(isSlow, persist = true){
      audioSlow = Boolean(isSlow);
      if(speedBtn){
        speedBtn.innerHTML = `<span class="icon">${audioSlow ? '½×' : '1×'}</span>`;
        speedBtn.setAttribute('aria-pressed', String(audioSlow));
        speedBtn.setAttribute('aria-label', audioSlow ? ui.labels.normalSpeed : ui.labels.slowerSpeed);
        speedBtn.setAttribute('title', audioSlow ? ui.labels.slowPlaybackEnabled : ui.labels.normalPlayback);
      }
      audioPlayer.playbackRate = getPlaybackRate();
      if(persist){
        try{ localStorage.setItem(AUDIO_SLOW_KEY, String(audioSlow)); }
        catch(e){ console.warn('Failed to save slow state', e); }
      }
    }

    function playAudioForText(text, { restart = true } = {}){
      if(audioMuted) return;
      const src = getAudioPathForText(text);
      if(!src) return;

      if (!restart && currentAudioSrc === src && !audioPlayer.paused) {
        return;
      }

      audioPlayer.pause();
      audioPlayer.src = src;
      currentAudioSrc = src;
      audioPlayer.playbackRate = getPlaybackRate();
      audioPlayer.currentTime = 0;
      audioPlayer.play().catch(() => {});
    }

    function getVocabularyPool(){
      const normalizedVocabulary = vocabulary
        .map((item) => {
          const normalizedRu = sanitizeVocabAnswer(item.ru);
          if (!normalizedRu) return null;
          return { ru: toDisplayCase(normalizedRu), en: item.en };
        })
        .filter(Boolean);

      const fallbackVocabulary = Object.entries(verbGloss).map(([infinitive, en]) => ({ ru: toDisplayCase(infinitive), en }));
      return normalizedVocabulary.length >= 4 ? normalizedVocabulary : fallbackVocabulary;
    }

    let currentAnswer = null;
    
    function showQuestion(focus=true){
      audioPlayer.pause();
      audioPlayer.currentTime = 0;

      optionsEl.innerHTML = '';
      lastResultEl.textContent = ui.messages.defaultResult;
      const mode = quizType?.value || 'pronouns';

      if(mode === 'numbers'){
        const keys = Object.keys(numbers).map(k=>Number(k));
        const numberItems = keys.map(n => ({ key: `numbers:${n}`, number: n, value: numbers[n] }));
        const chosenItem = pickWeightedQuestion(numberItems, lastQuestionKey);
        const n = chosenItem.number;
        const correctForm = numbers[n];
        currentAnswer = { mode:'numbers', number:n, correctForm, questionKey: chosenItem.key };
        lastQuestionKey = chosenItem.key;
        currentPromptAudioText = correctForm;
        promptEl.textContent = String(n);
        promptEl.setAttribute('aria-live','polite');
        
        const opts = new Set([correctForm]);
        const otherKeys = keys.filter(k=>k!==n); shuffle(otherKeys);
        for(const k of otherKeys){ opts.add(numbers[k]); if(opts.size>=4) break; }
        const options = shuffle(Array.from(opts));
        
        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          optionsEl.appendChild(btn);
        }
      } else if(mode === 'vocabulary'){
        const vocabPool = getVocabularyPool();
        const vocabItems = vocabPool.map(v => ({ key: `vocabulary:${v.ru.toLowerCase()}`, item: v }));
        const chosenItem = pickWeightedQuestion(vocabItems, lastQuestionKey);
        const rawItem = chosenItem.item;
        currentAnswer = { mode:'vocabulary', en:rawItem.en, correctForm:rawItem.ru, questionKey: chosenItem.key };
        lastQuestionKey = chosenItem.key;
        currentPromptAudioText = rawItem.ru;
        promptEl.textContent = rawItem.en;
        promptEl.setAttribute('aria-live','polite');

        const opts = new Set([rawItem.ru]);
        const otherRussian = shuffle(vocabPool.filter(v=>v.en !== rawItem.en).map(v=>v.ru));
        for(const rw of otherRussian){ opts.add(rw); if(opts.size >= 4) break; }
        const options = shuffle(Array.from(opts));

        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          optionsEl.appendChild(btn);
        }
      } else {
        const selectedVerbs = getSelectedVerbs();
        const pronounKeys = Object.keys(pronouns);
        const pronounVerbItems = [];
        for(const verbKey of selectedVerbs){
          for(const pronounKey of pronounKeys){
            pronounVerbItems.push({ key: `pronouns:${verbKey}:${pronounKey}`, verbKey, pronounKey });
          }
        }
        const chosenItem = pickWeightedQuestion(pronounVerbItems, lastQuestionKey);
        const verbKey = chosenItem.verbKey;
        const pronounKey = chosenItem.pronounKey;
        const conjKey = pronounToConjKey(pronounKey);
        const correctForm = verbs[verbKey].conjugations[conjKey];
        currentAnswer = { mode:'pronouns', verbKey, pronounKey, correctForm, conjKey, questionKey: chosenItem.key };
        lastQuestionKey = chosenItem.key;
        currentPromptAudioText = verbKey;
        promptEl.textContent = buildPrompt(pronounKey, verbKey);
        promptEl.setAttribute('aria-live','polite');
        
        const options = makeOptions(correctForm, verbKey, 4);
        for(const optText of options){
          const btn = document.createElement('button'); btn.className = 'option-btn'; btn.type = 'button'; btn.textContent = optText;
          btn.setAttribute('data-form', optText); btn.setAttribute('role','button'); btn.setAttribute('aria-pressed','false');
          btn.addEventListener('click', ()=> handleAnswer(btn));
          optionsEl.appendChild(btn);
        }
      }

      const first = optionsEl.querySelector('.option-btn');
      if(focus && first) first.focus();
    }

    function handleAnswer(button){
      const all = Array.from(optionsEl.querySelectorAll('.option-btn'));
      for(const b of all){ b.disabled = true; b.setAttribute('aria-pressed','true'); }
      const chosen = button.getAttribute('data-form');
      const correct = currentAnswer.correctForm;
      const isCorrect = chosen === correct;
      const fallbackPronounAudio = currentAnswer.mode === 'pronouns' ? currentAnswer.verbKey : null;
      const playbackText = getAudioPathForText(correct) ? correct : (fallbackPronounAudio || correct);
      
      if(isCorrect){ button.classList.add('correct'); tally.correct += 1; lastResultEl.textContent = ui.messages.correctResult; }
      else {
        button.classList.add('wrong');
        const correctBtn = all.find(b=>b.getAttribute('data-form')===correct);
        if(correctBtn) correctBtn.classList.add('correct');
        tally.incorrect += 1; lastResultEl.textContent = ui.messages.incorrectResult;
      }
      
      playAudioForText(playbackText);
      if(currentAnswer && currentAnswer.questionKey) updateQuestionStat(currentAnswer.questionKey, isCorrect);
      tally.attempts += 1; renderTally(); saveState();
      setTimeout(()=> showQuestion(true), 800);
    }

    muteBtn.addEventListener('click', ()=> setMuteState(!audioMuted));
    playAudioBtn.addEventListener('click', ()=>{
      const promptText = currentPromptAudioText || (currentAnswer ? currentAnswer.correctForm : '');
      playAudioForText(promptText, { restart: false });
    });
    replayAudioBtn.addEventListener('click', ()=>{
      const promptText = currentPromptAudioText || (currentAnswer ? currentAnswer.correctForm : '');
      playAudioForText(promptText, { restart: true });
    });
    speedBtn.addEventListener('click', ()=>{
      setSlowState(!audioSlow);
      const promptText = currentPromptAudioText || (currentAnswer ? currentAnswer.correctForm : '');
      if(!audioPlayer.paused){
        playAudioForText(promptText, { restart: true });
      }
    });
    
    nextBtn.addEventListener('click', ()=> showQuestion(true));
    quizType.addEventListener('change', ()=> showQuestion(true));
    resetBtn.addEventListener('click', openResetModal);
    resetCancelBtn.addEventListener('click', closeResetModal);
    resetConfirmBtn.addEventListener('click', confirmReset);
    resetModalEl.addEventListener('click', (event)=>{ if(event.target === resetModalEl) closeResetModal(); });
    
    document.addEventListener('keydown', (event)=>{
      if(event.key === 'Escape' && !resetModalEl.hidden){ closeResetModal(); }
    });

    function populateUI(){
      STORAGE_KEY = config.storageKey;
      QUESTION_STATS_KEY = config.questionStatsKey;
      AUDIO_MUTE_KEY = config.audioMuteKey;
      AUDIO_SLOW_KEY = config.audioSlowKey;
      AUDIO_MANIFEST_URL = config.audioManifestUrl;
      APP_LAST_UPDATED = config.appLastUpdated;
      document.querySelector('h1').textContent = ui.appTitle;
      nextBtn.textContent = ui.buttons.nextQuestion;
      resetBtn.textContent = ui.buttons.resetTally;
      resetCancelBtn.textContent = ui.buttons.cancel;
      resetConfirmBtn.textContent = ui.buttons.reset;
      quizType.innerHTML = '';
      quizType.setAttribute('aria-label', ui.labels.quizType);
      ui.quizTypes.forEach(qt => {
        const opt = document.createElement('option');
        opt.value = qt.value;
        opt.textContent = qt.label;
        quizType.appendChild(opt);
      });
      const tallyLabels = document.querySelectorAll('.tally .label');
      if(tallyLabels[0]) tallyLabels[0].textContent = ui.labels.correct;
      if(tallyLabels[1]) tallyLabels[1].textContent = ui.labels.incorrect;
      if(tallyLabels[2]) tallyLabels[2].textContent = ui.labels.attempts;
      document.getElementById('reset-modal-title').textContent = ui.modal.resetTitle;
      document.getElementById('reset-modal-text').textContent = ui.modal.resetText;
      optionsEl.setAttribute('aria-label', ui.labels.answerChoices);
      document.querySelector('.audio-controls').setAttribute('aria-label', ui.labels.audioControls);
      document.querySelector('.tally').setAttribute('aria-label', ui.labels.progressTally);
      playAudioBtn.setAttribute('aria-label', ui.labels.playPronunciation);
      playAudioBtn.setAttribute('title', ui.labels.playPronunciation);
      replayAudioBtn.setAttribute('aria-label', ui.labels.replayPronunciation);
      replayAudioBtn.setAttribute('title', ui.labels.replayPronunciation);
    }

    (async function init(){
      try{
        await loadDataFromJSON();
        populateUI();
        loadState();
        loadAudioManifest();
        const storedMute = localStorage.getItem(AUDIO_MUTE_KEY);
        setMuteState(storedMute === null ? true : storedMute === 'true', false);
        const storedSlow = localStorage.getItem(AUDIO_SLOW_KEY);
        setSlowState(storedSlow === null ? true : storedSlow === 'true', false);
        renderTally();
        if(buildStampEl) buildStampEl.textContent = ui.messages.lastUpdated + APP_LAST_UPDATED;
        promptEl.textContent = ui.messages.loading;
        setTimeout(()=> showQuestion(true), 120);
      }catch(e){
        if(promptEl) promptEl.textContent = ui.messages?.errorLoading || 'Error loading data. Please refresh the page.';
      }
    })();
    window._russianConj = { verbs, pronouns, showQuestion, resetState };
</script>
</body>
</html>
